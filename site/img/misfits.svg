<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-label="Country Club Misfits crest">
  <!-- Country Club Misfits: a proper club crest with one thing out of place.
       Hunter green and cream, preppy pink accents, one bent club, and a
       football on the tee where the golf ball should be. -->
  <defs>
    <!-- argyle: the most country-club pattern there is -->
    <pattern id="argyle" width="56" height="80" patternUnits="userSpaceOnUse">
      <rect width="56" height="80" fill="#17402d"/>
      <path d="M28 0 L56 40 L28 80 L0 40 Z" fill="#1d4d37"/>
      <path d="M0 0 L56 80 M56 0 L0 80" stroke="#f7a1c4" stroke-width="1.4" stroke-dasharray="5 5" opacity=".45"/>
    </pattern>
    <clipPath id="shield">
      <path d="M200 22 C150 22 96 34 56 52 V210 C56 300 120 362 200 404 C280 362 344 300 344 210 V52 C304 34 250 22 200 22 Z"/>
    </clipPath>
    <path id="arcTop" d="M64 140 Q200 50 336 140"/>
  </defs>

  <!-- shield: cream rim, green argyle field -->
  <path d="M200 10 C146 10 86 24 42 44 V210 C42 308 112 374 200 420 C288 374 358 308 358 210 V44 C314 24 254 10 200 10 Z" fill="#f4efe1"/>
  <path d="M200 22 C150 22 96 34 56 52 V210 C56 300 120 362 200 404 C280 362 344 300 344 210 V52 C304 34 250 22 200 22 Z" fill="#0f2d20"/>
  <g clip-path="url(#shield)">
    <rect x="40" y="150" width="320" height="270" fill="url(#argyle)"/>
    <rect x="40" y="20" width="320" height="136" fill="#0f2d20"/>
    <line x1="56" y1="152" x2="344" y2="152" stroke="#f4efe1" stroke-width="3"/>
  </g>
  <path d="M200 22 C150 22 96 34 56 52 V210 C56 300 120 362 200 404 C280 362 344 300 344 210 V52 C304 34 250 22 200 22 Z" fill="none" stroke="#f7a1c4" stroke-width="3"/>

  <!-- "COUNTRY CLUB" in proper club lettering along the top -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" letter-spacing="3" fill="#f4efe1" text-anchor="middle">
    <textPath href="#arcTop" startOffset="50%">COUNTRY CLUB</textPath>
  </text>
  <!-- three little stars, because every club crest has them -->
  <g fill="#f7a1c4">
    <path d="M160 132 l3 7 7 .5 -5.5 4.5 2 7 -6.5 -4 -6.5 4 2 -7 -5.5 -4.5 7 -.5 z"/>
    <path d="M200 124 l3.5 8 8 .6 -6.2 5.2 2.2 8 -7.5 -4.6 -7.5 4.6 2.2 -8 -6.2 -5.2 8 -.6 z"/>
    <path d="M240 132 l3 7 7 .5 -5.5 4.5 2 7 -6.5 -4 -6.5 4 2 -7 -5.5 -4.5 7 -.5 z"/>
  </g>

  <!-- crossed clubs: the left one is straight and proper, the right one is bent -->
  <g stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -16)">
    <!-- proper club: grip top left, head bottom right -->
    <line x1="108" y1="178" x2="268" y2="326" stroke="#f4efe1" stroke-width="9"/>
    <path d="M262 318 L300 330 Q308 334 302 342 L282 348 Q268 350 262 338 Z" fill="#f4efe1"/>
    <line x1="98" y1="168" x2="126" y2="194" stroke="#f7a1c4" stroke-width="18"/>
    <!-- the misfit: wrapped around a tree after a triple bogey -->
    <polyline points="292,178 232,236 168,236 132,326" fill="none" stroke="#f4efe1" stroke-width="9"/>
    <path d="M138 318 L100 330 Q92 334 98 342 L118 348 Q132 350 138 338 Z" fill="#f4efe1"/>
    <line x1="302" y1="168" x2="274" y2="194" stroke="#f7a1c4" stroke-width="18"/>
  </g>

  <!-- football on a tee, where the golf ball should be -->
  <g transform="translate(200 300)">
    <path d="M-6 26 L6 26 L3 52 L-3 52 Z" fill="#f4efe1"/>
    <path d="M-14 26 h28" stroke="#f4efe1" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="0" cy="0" rx="40" ry="24" fill="#8a4b2a" stroke="#f4efe1" stroke-width="3"/>
    <path d="M-30 0 Q0 -14 30 0" fill="none" stroke="#f4efe1" stroke-width="2" opacity=".55"/>
    <line x1="-14" y1="0" x2="14" y2="0" stroke="#f4efe1" stroke-width="3"/>
    <g stroke="#f4efe1" stroke-width="2.6" stroke-linecap="round">
      <line x1="-9" y1="-5" x2="-9" y2="5"/><line x1="-3" y1="-5" x2="-3" y2="5"/>
      <line x1="3" y1="-5" x2="3" y2="5"/><line x1="9" y1="-5" x2="9" y2="5"/>
    </g>
  </g>

  <!-- the crooked "MISFITS" banner across the bottom -->
  <g transform="rotate(-6 200 372)">
    <path d="M70 352 L330 352 L346 372 L330 392 L70 392 L54 372 Z" fill="#f7a1c4" stroke="#0f2d20" stroke-width="4"/>
    <text x="200" y="384" font-family="'Barlow Condensed', 'Arial Narrow', Impact, sans-serif" font-size="38" font-weight="700" letter-spacing="6" fill="#0f2d20" text-anchor="middle">MISFITS</text>
  </g>
</svg>
