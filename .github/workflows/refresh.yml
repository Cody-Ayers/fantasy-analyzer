# GitHub Actions: a computer GitHub lends you for free that runs these steps.
# It wakes up on the schedule below (or when you click "Run workflow"),
# pulls fresh ESPN data, saves it to the repo, and publishes the site.

name: Refresh leagues and publish

on:
  schedule:
    # Times are UTC (Pacific = UTC-7 in season). Every morning at 6:17am PT,
    # plus every 15 minutes while NFL games are being played:
    - cron: '17 13 * * *'           # daily, 6:17am PT
    - cron: '*/15 13-23 * * 0'      # Sunday 6am-5pm PT (London games through the late window)
    - cron: '*/15 0-4 * * 1'        # Sunday night game, 5-9pm PT
    - cron: '*/15 0-4 * * 2'        # Monday night game
    - cron: '*/15 0-4 * * 5'        # Thursday night game
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab
  push:
    branches: [main]        # refresh and republish whenever you change the code

permissions:
  contents: write           # to save the new data files
  pages: write              # to publish the site
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Pull fresh data from ESPN
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: node scripts/fetch.mjs

      - name: Send phone alerts (only if the NTFY_TOPIC secret is set)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node scripts/alerts.mjs

      - name: Save the new data to the repo
        run: |
          git config user.name "lineup-lab-bot"
          git config user.email "lineup-lab-bot@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Refresh league data"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
